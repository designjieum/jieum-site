<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>페이지를 찾을 수 없습니다 | 디자인 지음</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    /* 본 사이트와 같은 토큰: 흰 벽 · 먹색 · 보조 회색 · 불 꺼진 간판 · 주황 간판 */
    :root { --wall: #fafaf7; --ink: #141414; --muted: #5e6166; --unlit: #e9e8e3; --sign: #ff5a1f; }
    html, body { margin: 0; height: 100%; background: var(--wall); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; letter-spacing: -0.02em; }
    main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 32px 16px; box-sizing: border-box; max-width: 720px; margin: 0 auto; }
    .sign { display: inline-block; align-self: flex-start; border: 2px dashed var(--muted); padding: 8px 16px; font-size: 15px; font-weight: 700; color: var(--muted); }
    h1 { margin: 24px 0 16px; font-size: clamp(2.25rem, 9vw, 4rem); line-height: 1.1; font-weight: 900; letter-spacing: -0.05em; word-break: keep-all; }
    p { margin: 0 0 32px; font-size: 17px; line-height: 1.7; color: var(--muted); word-break: keep-all; }
    a { align-self: flex-start; display: inline-flex; align-items: center; height: 56px; padding: 0 32px; background: var(--sign); color: var(--ink); font-weight: 700; font-size: 17px; text-decoration: none; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <span class="sign">404</span>
    <h1>이 자리엔 아직 간판이 없어요.</h1>
    <p>주소가 바뀌었거나 없는 페이지예요. 홈으로 돌아가 디자인 지음을 둘러보세요.</p>
    <a href="/">홈으로 가기</a>
  </main>
</body>

</html>
