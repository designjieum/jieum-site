<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>페이지를 찾을 수 없습니다 | 디자인 지음</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #05070D; color: #cbd5e1; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.02em; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    p.code { margin: 0; font-size: 14px; font-weight: 600; color: #38bdf8; }
    h1 { margin: 8px 0 12px; font-size: 28px; font-weight: 800; color: #fff; }
    p.desc { margin: 0 0 28px; font-size: 15px; color: #94a3b8; line-height: 1.6; }
    a { display: inline-block; padding: 14px 28px; border-radius: 14px; background: #0ea5e9; color: #020617; font-weight: 800; text-decoration: none; }
    a:hover { background: #38bdf8; }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p class="desc">주소가 바뀌었거나 없는 페이지예요.<br />홈으로 돌아가 디자인 지음을 둘러보세요.</p>
    <a href="/">홈으로 가기</a>
  </main>
</body>

</html>
